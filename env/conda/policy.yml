# ACT/LeRobot 정책 서버용 conda 환경 (Isaac 과 분리; ZeroMQ 로만 통신).
name: openarm-policy
channels: [conda-forge]
dependencies:
  - python=3.12
  - pip
  - pyyaml
  - pyzmq
  - numpy
  - opencv
  - pip:
      - lerobot[intelrealsense]==0.6.2   # pyrealsense2 (D455f / D405). aarch64 에서 휠이 없으면 docs/setup-conda.md 참고
